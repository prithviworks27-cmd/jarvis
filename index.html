<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'">
  <title>JARVIS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="buddy" data-state="idle">
    <button id="body" aria-label="Talk to JARVIS" title="Click, double-tap Control, or press Option+Space. Right-click to quit.">
      <span class="eye l"></span>
      <span class="eye r"></span>
      <span id="nose"></span>
      <span id="mouth"></span>
    </button>
    <div id="bubble" hidden>
      <p id="you"></p>
      <p id="jarvis"></p>
      <p id="status" role="status" aria-live="polite"></p>
    </div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
