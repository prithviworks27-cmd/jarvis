<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'">
  <title>Alfred</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="buddy" data-state="idle">
    <button id="body" aria-label="Alfred" title="Double-tap Control or press Option+Space to talk. Click to poke, drag to move, right-click to quit.">
      <svg viewBox="140 40 260 280" aria-hidden="true">
        <defs>
          <linearGradient id="g" x1="0.3" y1="0" x2="0.6" y2="1">
            <stop offset="0" stop-color="#c8f553"/><stop offset=".35" stop-color="#8ee765"/><stop offset=".72" stop-color="#6fdc67"/><stop offset="1" stop-color="#4fb072"/>
          </linearGradient>
          <linearGradient id="lip" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4fb274"/><stop offset="1" stop-color="#3f9a78"/></linearGradient>
          <radialGradient id="halo"><stop offset="0" stop-color="#f4ff6a" stop-opacity=".9"/><stop offset="1" stop-color="#d3f650" stop-opacity="0"/></radialGradient>
          <radialGradient id="eye" cx="0.45" cy="0.4" r="0.65"><stop offset="0" stop-color="#fff"/><stop offset=".55" stop-color="#fdffd9"/><stop offset="1" stop-color="#eef548"/></radialGradient>
          <clipPath id="body"><path d="M 232,52 C 252,52 266,78 282,98 C 290,106 298,100 306,96 C 322,92 338,110 356,124 C 384,146 392,186 382,226 C 372,270 330,308 262,310 C 196,312 160,278 156,226 C 152,166 186,128 206,98 C 214,80 220,52 232,52 Z"/></clipPath>
        </defs>
        <g class="jelly">
          <path d="M 232,52 C 252,52 266,78 282,98 C 290,106 298,100 306,96 C 322,92 338,110 356,124 C 384,146 392,186 382,226 C 372,270 330,308 262,310 C 196,312 160,278 156,226 C 152,166 186,128 206,98 C 214,80 220,52 232,52 Z" fill="url(#g)"/>
          <g clip-path="url(#body)">
            <circle cx="233" cy="176" r="68" fill="url(#halo)"/><circle cx="338" cy="172" r="58" fill="url(#halo)"/>
            <path class="mouth" d="M 165,258 C 235,288 322,286 379,256 C 372,282 340,306 262,310 C 205,311 172,290 165,258 Z" fill="url(#lip)"/>
          </g>
        </g>
        <g class="eye"><circle cx="233" cy="184" r="46" fill="url(#eye)"/><g class="pupil"><ellipse cx="244" cy="186" rx="12" ry="17"/></g></g>
        <g class="eye"><circle cx="338" cy="176" r="40" fill="url(#eye)"/><g class="pupil"><ellipse cx="349" cy="178" rx="11" ry="16"/></g></g>
      </svg>
    </button>
  </div>
  <script src="vad.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
