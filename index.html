<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'">
  <title>JARVIS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="wrap">
    <div id="bubble" hidden>
      <p id="you"></p>

  </main>
  <script src="renderer.js"></script>
</body>
</html>
