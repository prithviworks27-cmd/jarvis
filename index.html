<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'">
  <title>JARVIS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="buddy" data-state="idle">
    <button id="body" aria-label="JARVIS" title="Double-tap Control or press Option+Space to talk. Click to poke, drag to move, right-click to quit.">
      <svg viewBox="20 15 250 220" aria-hidden="true">
        <defs>
          <linearGradient id="g" x1="0.35" y1="0" x2="0.55" y2="1">
            <stop offset="0" stop-color="#d2f96f"/><stop offset=".22" stop-color="#8fe477"/><stop offset=".6" stop-color="#58c29c"/><stop offset="1" stop-color="#3677ab"/>
          </linearGradient>
        </defs>
        <g class="jelly">
          <path d="M 28,160 C 28,102 68,66 110,62 C 116,54 124,42 130,38 C 136,34 142,40 138,48 C 135,55 141,60 150,64 C 194,72 222,112 222,160 C 222,200 184,226 125,226 C 66,226 28,200 28,160 Z" fill="url(#g)"/>
          <g class="pleats" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="4" stroke-linecap="round">
            <path d="M 112,66 C 100,76 92,86 88,98"/><path d="M 122,64 C 116,78 114,88 114,98"/><path d="M 146,66 C 158,74 168,84 172,96"/>
          </g>
        </g>
        <g class="drops" fill="#6fd24f">
          <path d="M 207,66 C 198,54 200,42 214,34 C 220,48 222,60 207,66 Z"/>
          <path d="M 226,92 C 232,84 244,80 254,84 C 250,96 238,102 226,92 Z"/>
        </g>
        <g class="eye"><circle cx="113" cy="127" r="27" fill="#fbfce9"/><g class="pupil"><circle cx="118" cy="129" r="11"/><circle cx="114" cy="124" r="3.4" fill="#fff"/></g></g>
        <g class="eye"><circle cx="172" cy="122" r="27" fill="#fbfce9"/><g class="pupil"><circle cx="177" cy="124" r="11"/><circle cx="173" cy="119" r="3.4" fill="#fff"/></g></g>
        <path class="mouth" d="M 126,178 L 160,178" stroke="#000" stroke-width="5" stroke-linecap="round" fill="none"/>
      </svg>
    </button>
    <div id="bubble" hidden>
      <p id="you"></p>
      <p id="jarvis"></p>
      <p id="status" role="status" aria-live="polite"></p>
    </div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
